<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#4F46E5"/>

  <!-- Simplified Nest -->
  <path d="M 25 65 Q 50 80 75 65" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 30 55 Q 50 68 70 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Document -->
  <rect x="35" y="25" width="30" height="38" rx="3" fill="white"/>

  <!-- Lines on document -->
  <line x1="40" y1="35" x2="60" y2="35" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="43" x2="60" y2="43" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="51" x2="55" y2="51" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>

  <!-- Query/Search symbol -->
  <circle cx="67" cy="42" r="11" fill="white" stroke="#10B981" stroke-width="3"/>
  <line x1="75" y1="50" x2="82" y2="57" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

  <!-- Letter Q (subtle) -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle" opacity="0.3">Q</text>
</svg>
