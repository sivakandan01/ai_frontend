  <!-- Lines on document -->
  <line x1="85" y1="70" x2="115" y2="70" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="82" x2="115" y2="82" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="94" x2="105" y2="94" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>

  <!-- Search/Query Circle -->
  <circle cx="135" cy="85" r="18" fill="white" stroke="#10B981" stroke-width="4"/>
  <line x1="147" y1="97" x2="158" y2="108" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Small dots representing AI/data -->
  <circle cx="50" cy="75" r="3" fill="#10B981" opacity="0.6"/>
  <circle cx="45" cy="90" r="2.5" fill="#10B981" opacity="0.5"/>
  <circle cx="55" cy="95" r="2" fill="#10B981" opacity="0.4"/>
  <circle cx="150" cy="115" r="3" fill="#4F46E5" opacity="0.6"/>
  <circle cx="155" cy="105" r="2.5" fill="#4F46E5" opacity="0.5"/>
  <circle cx="145" cy="125" r="2" fill="#4F46E5" opacity="0.4"/>
</svg>
