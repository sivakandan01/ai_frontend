<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#4F46E5" opacity="0.1"/>

  <!-- Nest Structure (curved bottom) -->
  <path d="M 60 120 Q 100 150 140 120" fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>
  <path d="M 65 110 Q 100 135 135 110" fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M 70 100 Q 100 120 130 100" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Document/Query Icon in the center -->
